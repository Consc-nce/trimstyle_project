{% extends 'base.html' %}

{% block title %}Register - TrimStyle{% endblock %}

{% block content %}
    <div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 text-center">
                <div class="w-12 h-12 bg-white bg-opacity-20 rounded-lg flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold">Join TrimStyle</h1>
                <p class="text-blue-100 mt-1">Create your account today</p>
            </div>
            
            <!-- Form -->
            <div class="p-8">
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    
                    <!-- First Name -->
                    <div>
                        <label for="first_name" class="block text-sm font-bold text-gray-700 mb-1">
                            First Name
                        </label>
                        <input type="text"
                               id="first_name"
                               name="first_name"
                               value="{{ first_name }}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                               placeholder="John">
                    </div>
                    
                    <!-- Last Name -->
                    <div>
                        <label for="last_name" class="block text-sm font-bold text-gray-700 mb-1">
                            Last Name
                        </label>
                        <input type="text"
                               id="last_name"
                               name="last_name"
                               value="{{ last_name }}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                               placeholder="Doe">
                    </div>
                    
                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-sm font-bold text-gray-700 mb-1">
                            Username
                        </label>
                        <input type="text"
                               id="username"
                               name="username"
                               value="{{ username }}"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                               placeholder="johndoe">
                    </div>
                    
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-bold text-gray-700 mb-1">
                            Email
                        </label>
                        <input type="email"
                               id="email"
                               name="email"
                               value="{{ email }}"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                               placeholder="john@example.com">
                    </div>
                    
                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-bold text-gray-700 mb-1">
                            Phone Number
                        </label>
                        <input type="tel"
                               id="phone"
                               name="phone"
                               value="{{ phone }}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                               placeholder="(555) 123-4567">
                    </div>
                    
                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-bold text-gray-700 mb-1">
                            Password
                        </label>
                        <input type="password"
                               id="password"
                               name="password"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                               placeholder="Min 8 characters">
                        <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters long</p>
                    </div>
                    
                    <!-- Confirm Password -->
                    <div>
                        <label for="password_confirm" class="block text-sm font-bold text-gray-700 mb-1">
                            Confirm Password
                        </label>
                        <input type="password"
                               id="password_confirm"
                               name="password_confirm"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                               placeholder="Repeat password">
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit"
                            class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-bold hover:bg-blue-700 transition transform hover:scale-105 mt-6">
                        Create Account
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Already have an account?</span>
                    </div>
                </div>
                
                <!-- Sign In Link -->
                <a href="{% url 'accounts:login' %}"
                   class="w-full block text-center bg-gray-100 text-gray-700 py-2 px-4 rounded-lg font-bold hover:bg-gray-200 transition">
                    Sign In
                </a>
            </div>
        </div>
    </div>
{% endblock %}
